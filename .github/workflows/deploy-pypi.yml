name: Build and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.python-version, 't') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
        python-version:
          - "3.6"
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.14t"
        exclude:
          # Official Windows ARM64 installers begin at Python 3.11.
          - os: windows-11-arm
            python-version: "3.6"
          - os: windows-11-arm
            python-version: "3.7"
          - os: windows-11-arm
            python-version: "3.8"
          - os: windows-11-arm
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          check-latest: true

      - name: Install a Python 3.6-compatible pip
        if: matrix.python-version == '3.6'
        run: python -m pip install --upgrade "pip==21.3.1"

      - name: Upgrade pip
        if: matrix.python-version != '3.6'
        run: python -m pip install --upgrade pip

      - name: Build wheel
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel and run lifecycle sample
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl).FullName
          python -m pip install --force-reinstall $wheel
          python sample/sample.py

      - name: Store wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-${{ matrix.os }}-${{ runner.arch }}-Python${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: deploy-pypi
      url: https://pypi.org/p/sysproxy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          pattern: python-package-distributions-*
          merge-multiple: true
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          pattern: python-package-distributions-*
          merge-multiple: true
          path: dist

      - name: Create release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          dist/*
          --repo '${{ github.repository }}'
          --verify-tag
          --generate-notes
