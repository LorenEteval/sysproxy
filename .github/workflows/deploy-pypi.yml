name: Build and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: AMD64
            builds: "cp{39,310,311,312,313,314,314t}-win_amd64"
          - runner: windows-11-arm
            arch: ARM64
            builds: "cp{311,312,313,314,314t}-win_arm64"
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.builds }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  legacy-wheels:
    name: Legacy wheel (Python ${{ matrix.python-version }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.7", "3.8"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<22; python_version<'3.7'" "pip<25; python_version>='3.7'"
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Test installed wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath wheelhouse -Filter *.whl).FullName
          python -m pip install --force-reinstall $wheel
          python sample/sample.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Python${{ matrix.python-version }}-AMD64
          path: wheelhouse/*.whl
          if-no-files-found: error

  python313t-wheels:
    name: Python 3.13t wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: AMD64
            python-architecture: x64
          - runner: windows-11-arm
            arch: ARM64
            python-architecture: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13t"
          architecture: ${{ matrix.python-architecture }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Test installed wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath wheelhouse -Filter *.whl).FullName
          python -m pip install --force-reinstall $wheel
          python sample/sample.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Python3.13t-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [sdist, wheels, legacy-wheels, python313t-wheels]
    runs-on: ubuntu-latest
    environment:
      name: deploy-pypi
      url: https://pypi.org/p/sysproxy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Create release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          "${{ github.ref_name }}"
          dist/*
          --repo "${{ github.repository }}"
          --generate-notes
          --verify-tag
